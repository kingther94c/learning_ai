[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnai"
version = "0.1.0"
description = "A hands-on lab for understanding ML, DL, NLP, Transformers and GPT by rebuilding them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "torch>=2.1",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.0", "ipywidgets>=8.0", "tqdm>=4.66"]
hf = ["transformers>=4.40", "tokenizers>=0.19", "datasets>=2.18"]
dev = ["pytest>=7.4", "ruff>=0.4", "nbformat>=5.9"]
# Released open-weight models via MLX; Apple silicon only (`make llm-setup`).
llm = [
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=0.30",
    "pyarrow>=15",  # learnai.finbench reads one parquet file (CFA-Easy)
]

[project.scripts]
learnai = "learnai.cli:main"

[tool.setuptools.packages.find]
include = ["learnai*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
